services:
  nginx:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy
    volumes:
      - ~/letsencrypt/etc/letsencrypt:/etc/letsencrypt
      - ~/letsencrypt/var/www/certbot:/var/www/certbot
    ports:
      - "80:80"
      - "81:81"
      - "443:443"

    restart: always
    environment:
      TZ: "America/Sao_Paulo"