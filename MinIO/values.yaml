image:
  repository: quay.io/minio/minio
  tag: RELEASE.2024-12-18T13-15-44Z

mode: standalone

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

persistence:
  enabled: true
  size: 10Gi

existingSecrets: "minio-credentials"

consoleIngress:
  enabled: true
  hosts:
   - console.minio.local

buckets:
  - name: nextcloud
  - name: backups