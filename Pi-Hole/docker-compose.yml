services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: always
    environment:
      TZ: 'America/Sao_Paulo'
      FTLCONF_webserver_api_password: ${WEBPASSWORD}
      FTLCONF_dns_listeningMode: 'ALL'
    volumes:
      - 'pihole:/etc/pihole'
    networks:
      dns-network:
        ipv4_address: 172.254.0.252
      default:

volumes:
  pihole: